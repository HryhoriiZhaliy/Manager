<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Task Manager - Admin Panel</h1>
            <a href="/" class="admin-link">Back to Site</a>
        </div>
    </header>

    <main class="container">
        <!-- Login Section - Shown by default -->
        <section id="login-section" class="login-container">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="login-error" class="error hidden"></div>
                <button type="submit">Login</button>
            </form>
        </section>

        <!-- Admin Dashboard - Hidden by default -->
        <section id="admin-dashboard" class="hidden">
            <div class="tasks-container">
                <h2>Add New Task</h2>
                <form id="add-task-form">
                    <div class="form-group">
                        <label for="task-title">Title</label>
                        <input type="text" id="task-title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" name="description" required></textarea>
                    </div>
                    <div id="add-task-error" class="error hidden"></div>
                    <button type="submit">Add Task</button>
                </form>
            </div>

            <div class="tasks-container">
                <h2>Manage Tasks</h2>
                <div id="admin-tasks-list" class="tasks-list">
                    <!-- Tasks will be loaded here dynamically -->
                    <div class="loading">Loading tasks...</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Task Manager. All rights reserved.</p>
        </div>
    </footer>

    <!-- Task template for JavaScript -->
    <template id="admin-task-template">
        <div class="task-item">
            <div class="task-header">
                <h3 class="task-title"></h3>
                <div class="task-status">
                    <span class="status-text"></span>
                </div>
            </div>
            <p class="task-description"></p>
            <div class="task-footer">
                <span class="task-date"></span>
                <div class="admin-controls">
                    <button class="edit-task-btn">Edit</button>
                    <button class="delete-task-btn danger">Delete</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Edit Task Modal Template -->
    <template id="edit-modal-template">
        <div class="modal-overlay">
            <div class="modal-content">
                <h2>Edit Task</h2>
                <form id="edit-task-form">
                    <div class="form-group">
                        <label for="edit-task-title">Title</label>
                        <input type="text" id="edit-task-title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-task-description">Description</label>
                        <textarea id="edit-task-description" name="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="edit-task-completed" name="completed">
                            Mark as completed
                        </label>
                    </div>
                    <div id="edit-task-error" class="error hidden"></div>
                    <div class="modal-buttons">
                        <button type="submit">Save Changes</button>
                        <button type="button" id="cancel-edit">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </template>

    <script src="admin.js" type="module"></script>
