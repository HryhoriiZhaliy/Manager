<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager · Admin</title>

  <style>
    /* общий стиль карточки */
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;
         display:flex;justify-content:center;align-items:flex-start;min-height:100vh}

    .box{background:#fff;padding:20px 30px;border-radius:6px;
         box-shadow:0 0 8px rgba(0,0,0,.1);width:380px;margin-top:60px}

    h2{text-align:center;margin:0 0 20px}

    input{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;
          border-radius:4px;box-sizing:border-box}

    button{width:100%;padding:10px;background:#3399e6;border:none;color:#fff;
           font-weight:bold;border-radius:4px;cursor:pointer}
    button:hover{background:#287bb5}

    /* список задач: ровные строки + кнопки */
    ul{list-style:none;padding:0;margin:0}
    ul li{
      display:flex;align-items:center;gap:12px;
      padding:12px 0;border-bottom:1px solid #ddd
    }
    ul li input[type="checkbox"]{flex:0 0 20px;height:20px;cursor:pointer}
    ul li span{flex:1 1 auto;word-break:break-word}
    ul li button{
      flex:0 0 32px;background:none;border:none;font-size:18px;cursor:pointer;padding:0
    }
    .edit-btn {color:#1b7be0}
    .edit-btn:hover{color:#135ea8}
    .delete-btn{color:#d00}
    .delete-btn:hover{color:#a00}
  </style>
</head>
<body>

  <!-- ── Форма входа ───────────────────────────────────────────── -->
  <div id="login-container" class="box">
    <h2>Admin Login</h2>
    <form id="login-form">
      <input id="username" type="text" placeholder="Username" required/>
      <input id="password" type="password" placeholder="Password" required/>
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- ── Админ‑панель ──────────────────────────────────────────── -->
  <div id="panel-container" class="box" style="display:none">
    <h2>Task Manager · Admin</h2>

    <!-- Добавление новой задачи -->
    <form id="add-task-form">
      <input id="newTask" type="text" placeholder="New task…" required/>
      <button type="submit">Add Task</button>
    </form>

    <!-- Список задач -->
    <ul id="tasks-list"></ul>

    <!-- Выход -->
    <button id="logout-btn" style="margin-top:15px;background:#777">Log out</button>
  </div>

  <script src="admin.js" defer></script>
</body>
</html>
