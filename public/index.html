<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>

  <!-- Единый минималистичный стиль -->
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;
         display:flex;justify-content:center;align-items:flex-start;min-height:100vh}

    .box{background:#fff;padding:20px 30px;border-radius:6px;box-shadow:0 0 8px rgba(0,0,0,.1);
         width:350px;margin-top:60px}

    h1{text-align:center;margin:0 0 20px;font-size:24px;color:#333}

    /* ссылка на админку */
    .admin-link{display:block;text-align:center;margin-top:-10px;margin-bottom:20px;
                color:#287bb5;text-decoration:none;font-size:14px}
    .admin-link:hover{text-decoration:underline}

    /* поиск */
    #search{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;margin-bottom:15px}

    /* список задач – ровные строки */
    ul{list-style:none;padding:0;margin:0}
    ul li{
      display:flex;align-items:center;gap:12px;
      padding:12px 0;border-bottom:1px solid #ddd
    }
    ul li input[type="checkbox"]{
      flex:0 0 20px;height:20px;cursor:pointer
    }
    ul li span{flex:1 1 auto;word-break:break-word}
  </style>
</head>
<body>

  <div class="box">
    <h1>Task Manager</h1>
    <a href="admin.html" class="admin-link">Admin panel</a>

    <input type="text" id="search" placeholder="Search tasks…"/>

    <ul id="tasks-list"></ul>
  </div>

  <!-- Логика загрузки/поиска -->
  <script src="app.js" defer></script>
</body>
</html>
