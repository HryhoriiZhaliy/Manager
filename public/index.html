<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    .header {
      background-color: #3399e6;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .admin-link {
      color: #fff;
      background-color: #287bb5;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 4px;
    }

    .admin-link:hover {
      background-color: #1e5d8a;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 50px auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    #search {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }

    ul li input[type="checkbox"] {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Task Manager</h1>
    <a href="/admin.html" class="admin-link">Admin Panel</a>
  </div>

  <div class="container">
    <input type="text" id="search" placeholder="Search tasks...">
    <ul id="tasks-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
