<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>

  <!-- Унифицированные стили (совпадают с admin.html) -->
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;
         display:flex;justify-content:center;align-items:flex-start;min-height:100vh}

    .box{background:#fff;padding:20px 30px;border-radius:6px;
         box-shadow:0 0 8px rgba(0,0,0,.1);width:350px;margin-top:60px}

    h1{text-align:center;margin:0 0 20px;font-size:24px;color:#333}

    /* ссылка на админку в стиле кнопки */
    .admin-link{
      display:block;text-align:center;margin-bottom:20px;
      color:#fff;background:#287bb5;text-decoration:none;
      padding:8px 12px;border-radius:4px;font-size:14px
    }
    .admin-link:hover{background:#1e5d8a}

    #search{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;
            box-sizing:border-box;margin-bottom:15px}

    /* ровные строки списка (такие же, как в admin.html) */
    ul{list-style:none;padding:0;margin:0}
    ul li{
      display:flex;align-items:center;gap:12px;
      padding:12px 0;border-bottom:1px solid #ddd
    }
    ul li input[type="checkbox"]{
      flex:0 0 20px;height:20px;cursor:pointer
    }
    ul li span{flex:1 1 auto;word-break:break-word}
  </style>
</head>
<body>

  <div class="box">
    <h1>Task Manager</h1>
    <a class="admin-link" href="admin.html">Admin panel</a>

    <input id="search" type="text" placeholder="Search tasks…"/>

    <ul id="tasks-list"></ul>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
